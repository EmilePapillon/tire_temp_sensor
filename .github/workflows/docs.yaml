name: Docs

# Publish the Doxygen API reference to GitHub Pages on every push to main, so
# the published docs always describe what main contains. The Build workflow
# already fails on undocumented code; this one only publishes.
#
# One-time repository setting: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq doxygen graphviz

      - name: Generate API reference
        run: doxygen docs/Doxyfile

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
