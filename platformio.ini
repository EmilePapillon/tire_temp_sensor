; PlatformIO Project Configuration File
;
; Two environments:
;   adafruit_feather_nrf52832 - the firmware image (Arduino + Bluefruit).
;   native                    - host build of lib/ + test/ for CI unit tests.
;
; Both compile as C++17: lib/ relies on std::void_t-based shape traits (see
; lib/*/i_*.hh). The Adafruit nRF52 core defaults to gnu++11, so the firmware
; environment overrides that flag explicitly.

[env:adafruit_feather_nrf52832]
platform = nordicnrf52
board = adafruit_feather_nrf52832
framework = arduino
build_unflags = -std=gnu++11
build_flags = -DSERIAL_BUFFER_SIZE=128 -std=gnu++17
extra_scripts = pre:scripts/build_info.py
monitor_speed = 115200
monitor_raw = yes

[env:native]
platform = native
build_flags = -std=gnu++17
lib_compat_mode = off
